name: Bug report
description: Report a reproducible problem using synthetic data only.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not attach client evidence, passwords, tokens or sensitive filenames. Use a private channel for security issues."
  - type: input
    id: version
    attributes:
      label: App version / commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows / OS version and filesystem
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Synthetic reproduction and mode
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted error text / test output
      render: text
